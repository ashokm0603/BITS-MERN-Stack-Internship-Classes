<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200vh;
            width: 100vw;
            background-image: url('https://t4.ftcdn.net/jpg/03/04/86/61/360_F_304866110_63UOE2JR9mdXnB6IOlqjgNUrkkAPLvvI.jpg');
            background-repeat: no-repeat;
            background-size: cover;
        }
        fieldset{
            border: none;
            backdrop-filter: blur(50px);
            margin: 20px;
            padding: 30px;
            border-radius: 10px 50px;
            box-shadow: 10px 10px 5px aliceblue;
        }

        label{
            color: aliceblue;
            font-size: 20px;
            font-weight: bold;
            font-style: italic;
            margin-right: 20px;
        }
        button{
            padding: 10px 30px;
            background-color: salmon;
            font-weight: bold;
            font-style: italic;
            font-family: monospace;
            border-radius: 8px;
        }
        h1{
            text-align: center;
            color: transparent;
            background-image: linear-gradient(red , goldenrod);
            background-clip: text;
            font-size: 50px;
        }
    </style>
</head>

<body>
    <form action="">
        <fieldset>
            <h1>Job Application Form</h1>
            <label for="fname">First Name :</label>
            <input type="text" id="fname" maxlength="8" minlength="3" required placeholder="Enter First Name">

            <br><br>
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" placeholder="Enter Last Name" minlength="3" maxlength="5">

            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" required placeholder="Enter Email">

            <br><br>
            <label for="dob">DOB:</label>
            <input type="date" id="dob" required placeholder="Enter Email">

            <br><br>
            <label for="dob">Gender:</label>
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female
            <input type="radio" name="gender">Others

            <br><br>
            <label for="phNo">Phone No:</label>
            <input type="tel" pattern="[6-9]{1}[0-9]{9}" id="phNo" required placeholder="+91">

            <br><br>
            <label for="state">State</label>
            <select name="" id="state">
                <option value="AP">AP</option>
                <option value="KA">KA</option>
                <option value="KL">KL</option>
                <option value="DL">DL</option>
                <option value="UP">UP</option>
            </select>

            <br><br>
            <label for="address">Address:</label>
            <textarea name="" rows="3" cols="30" id="address" placeholder="Enter full address"></textarea>

            <br><br>
            <label for="">Skills :</label>
            <input type="checkbox"> Node Js
            <input type="checkbox"> CI/CD PipeLines
            <input type="checkbox"> Git
            <input type="checkbox"> MongoDB
            <br><br>
            <label for="language">Languages:</label>
            <input type="range">English
            <input type="range">Hindi
            <input type="range">Kannada
            <input type="range">Telugu
            <br><br>

            <label for="resume">Resume :</label>
            <input type="file" name="" accept=".pdf , .doc" id="resume">






            <button type="submit">Submit</button>
            <button type="reset">Clear</button>


        </fieldset>
    </form>
</body>

</html>
